<style>

.copy { font: 600 11px/1 var(--body); color: var(--term-fg); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 6px 10px; cursor: pointer; }

.check input:checked + span.box { background: var(--ok); border-color: var(--ok); color: #fff; }
.nav-btns { display: flex; gap: 8px; }

button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

@media (max-width: 760px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  nav.rail { position: static; overflow-x: auto; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)) 4px; }
  nav.rail ol { display: flex; gap: 6px; width: max-content; }
  nav.rail a { grid-template-columns: 28px auto; padding: 6px 10px 6px 6px; background: var(--surface); border: 1px solid var(--line); }
  nav.rail a[aria-current="step"] { box-shadow: inset 0 -3px 0 var(--mark); }
  nav.rail .tick, nav.rail .opt { display: none; }
  nav.rail a.done .num { border-color: var(--ok); color: var(--ok); }

}

<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="sign" aria-hidden="true">P</div>
      <div>
        <h1>Getting started with park</h1>
        <p class="sub">Save where you were, so you or your agent can pick it up later. <a href="https://github.com/svandragt/park">Source on GitHub</a></p>
      </div>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-label"><span>Progress</span><span id="progress-text">0 of 7</span></div>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Steps"><ol id="rail"></ol></nav>
    <main class="step" id="step" tabindex="-1"><noscript><p>This guide needs JavaScript to show its steps. The <a href="https://github.com/svandragt/park#readme">README</a> covers the same commands.</p></noscript></main>
  </div>
</div>

<template id="t-install">
  <p class="eyebrow">Step 1 · About 2 minutes</p>
  <h2>Install park</h2>
  <p class="lead">park is one Go binary. It keeps your parked items in a local SQLite database.</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>go install github.com/svandragt/park@latest
<span class="p">$ </span>command -v park
<span class="p">$ </span>park version</pre></div>
  <p>Check that <code>command -v park</code> points into <code>$(go env GOPATH)/bin</code> or your <code>GOBIN</code>. If another <code>park</code> comes earlier on your <code>PATH</code>, that one runs instead.</p>
  <h3>Where your items live</h3>
  <p>The database is at <code>~/.local/share/park/park.db</code>, or under <code>$XDG_DATA_HOME</code> when that is set. Set <code>PARK_DB</code> to use another file.</p>
  <div class="note"><strong>Trying park in a throwaway database?</strong><p>Unset <code>PARK_SYNC_DIR</code> as well as changing <code>PARK_DB</code>. While <code>PARK_SYNC_DIR</code> is set, every database you point park at reads and writes the same sync log, so test items reach your real items.</p></div>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>env -u PARK_SYNC_DIR PARK_DB=/tmp/park-test.db park list</pre></div>
</template>

<template id="t-park">
  <p class="eyebrow">Step 2 · About 3 minutes</p>
  <h2>Park your first item</h2>
  <p class="lead">Park the thing you are in the middle of. Write it for the person who picks it up next, who may be you in a week or an agent with no memory of today.</p>
  <p>Run this inside a git repository:</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park add --name "Fix login redirect loop" \
    --desc "Users bounce between /login and /dashboard" \
    --why "Blocks the release" \
    --how "Start at auth/session.go:42" \
    --tags auth</pre></div>
  <div class="term out"><div class="term-head">Output</div><pre>parked #1: Fix login redirect loop</pre></div>
  <h3>What each field is for</h3>
  <ul>
    <li><code>--name</code> is the one line you see in lists. It is the only required field.</li>
    <li><code>--desc</code> says what is wrong or what the work is.</li>
    <li><code>--why</code> says why it matters, so you can decide later whether it still does.</li>
    <li><code>--how</code> names the exact next step: a file and line, a command, a person to ask.</li>
    <li><code>--body</code> holds longer notes. <code>park edit 1 --append-body "..."</code> adds to it later.</li>
  </ul>
  <p>park records the hostname, the git remote and the current branch for you.</p>
</template>

<template id="t-find">
  <p class="eyebrow">Step 3 · About 3 minutes</p>
  <h2>Find it again</h2>
  <p class="lead">Three commands cover most lookups: list what is open, search for a word, then show one item in full.</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park list             <span class="c"># every active item, in every repo</span>
<span class="p">$ </span>park list --current   <span class="c"># only this repo and branch</span>
<span class="p">$ </span>park search redirect  <span class="c"># full-text search, active items</span></pre></div>
  <div class="term out"><div class="term-head">Output of park search redirect</div><pre>#1  [active]  Fix login redirect loop
     Users bounce between /login and /dashboard
     https://github.com/me/my-app  (main)</pre></div>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park show 1
<span class="p">$ </span>park show -           <span class="c"># the item you added last</span></pre></div>
  <div class="term out"><div class="term-head">Output of park show 1</div><pre># Fix login redirect loop  [#1 · active]

**Users bounce between /login and /dashboard**

Why: Blocks the release
How to apply: Start at auth/session.go:42

Type: task  Tags: auth
Repo: https://github.com/me/my-app  Branch: main
Device: my-laptop  Parked: 2026-11-20 11:01</pre></div>
  <p>Search covers the name, description, body, why, how and tags. Add <code>--status all</code> to include resolved items.</p>
</template>

<template id="t-finish">
  <p class="eyebrow">Step 4 · About 1 minute</p>
  <h2>Close the loop</h2>
  <p class="lead">Resolve an item as soon as the work is done. A short list of open items is one you will read.</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park done 1           <span class="c"># resolved</span>
<span class="p">$ </span>park archive 1        <span class="c"># no longer relevant, kept for the record</span>
<span class="p">$ </span>park reopen 1         <span class="c"># back to active</span></pre></div>
  <div class="term out"><div class="term-head">Output of park done 1</div><pre>#1 marked as resolved</pre></div>
  <h3>Removing items for good</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park add --name "Try out park delete"
<span class="p">$ </span>park delete -         <span class="c"># removes the item you added last</span>
<span class="p">$ </span>park prune --days 30  <span class="c"># removes resolved and archived items older than 30 days</span></pre></div>
  <p>Both commands are permanent. Use <code>done</code> or <code>archive</code> when you are unsure.</p>
</template>

<template id="t-organise">
  <p class="eyebrow">Step 5 · About 3 minutes</p>
  <h2>Organise with tags, types and milestones</h2>
  <p class="lead">Tags group related items. Types say what kind of work an item is. A milestone collects the items that ship together.</p>
  <h3>Tags</h3>
  <p>Tag every item for a ticket with the ticket key, so one command finds them all:</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park edit 1 --tags "auth,ABC-123"
<span class="p">$ </span>park list --tag ABC-123</pre></div>
  <h3>Types</h3>
  <p>The default type is <code>task</code>. The others are <code>project</code>, <code>bug</code>, <code>feature</code>, <code>chore</code> and <code>docs</code>. Filter with <code>park list --type bug</code>.</p>
  <h3>Milestones</h3>
  <p>A milestone is an item of type <code>project</code>. Point other items at it with <code>--parent</code>, and <code>park show</code> counts how many are done.</p>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park add --name "Q3 release" --type project
<span class="p">$ </span>park add --name "Write migration notes" --type docs --parent -
<span class="p">$ </span>park show 2</pre></div>
  <div class="term out"><div class="term-head">Output of park show 2</div><pre># Q3 release  [#2 · active]


Type: project
Repo: https://github.com/me/my-app  Branch: main
Device: my-laptop  Parked: 2026-11-20 11:01

Children: 0/1 done

#3  [active]  Write migration notes
     https://github.com/me/my-app  (main)</pre></div>
  <h3>Another repository</h3>
  <p>To file an item under a repository you are not in, pass its remote: <code>park add --name "x" --remote git@github.com:me/other.git</code>.</p>
</template>

<template id="t-agent">
  <p class="eyebrow">Step 6 · About 5 minutes</p>
  <h2>Connect your coding agent</h2>
  <p class="lead">With the hooks installed, the agent sees this repo's parked items when a session starts, and again when it opens a file an item names.</p>
  <h3>Install the hooks</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park hook             <span class="c"># prints the config, changes nothing</span>
<span class="p">$ </span>park hook --install   <span class="c"># adds it to Claude Code and Codex settings</span></pre></div>
  <p>The installer writes to <code>~/.claude/settings.json</code> and <code>~/.codex/hooks.json</code>, for whichever exists, and keeps the hooks already there. Hooks load when a session starts, so open a new session afterwards. In Claude Code, <code>/hooks</code> reloads them.</p>
  <h3>What the agent sees</h3>
  <p>At session start, the agent gets one line per active item for the current repository. Items parked on the current branch come first, then items tagged with the ticket key in the branch name (<code>ABC-123</code> for <code>ABC-123-slug</code> or <code>feature/ABC-123-slug</code>), then the rest, most recently updated first. Claude Code passes on only the first 2 KB, so with many items the older ones may not fit:</p>
  <div class="term out"><div class="term-head">Session context</div><pre>Parked items here (id name [tags]). Surface anything relevant; do not act on it unprompted. Before a task: park search &lt;words&gt;; for a ticket, park list --tag &lt;KEY&gt;; park show &lt;id&gt; for detail.

3 Write migration notes
2 Q3 release
1 Fix login redirect loop [auth,ABC-123]</pre></div>
  <p>In Claude Code, a second hook runs when the agent reads or edits a file. If an active item names that file, the agent sees up to five matching items and can run <code>park show</code> for detail. Codex gets only the session-start hook.</p>
  <h3>Let the agent park for you</h3>
  <p>The repository includes a Claude Code skill. With it installed, you can say "park this", "show parked" or "work on #2".</p>
  <div class="term"><div class="term-head">Terminal, from a park checkout<button class="copy">Copy</button></div><pre><span class="p">$ </span>mkdir -p ~/.claude/skills/park
<span class="p">$ </span>cp .claude/skills/park/SKILL.md ~/.claude/skills/park/SKILL.md</pre></div>
</template>

<template id="t-sync">
  <p class="eyebrow">Step 7 · Optional · About 5 minutes</p>
  <h2>Sync between machines</h2>
  <p class="lead">Skip this step if you use park on one machine. With sync, each machine writes its own log file to a shared folder and reads everyone else's.</p>
  <h3>On every machine</h3>
  <p>Point <code>PARK_SYNC_DIR</code> at a folder your file syncer keeps in step. Leave <code>PARK_DB</code> on its local default.</p>
  <div class="term"><div class="term-head">Shell profile<button class="copy">Copy</button></div><pre>export PARK_SYNC_DIR="$HOME/sync/park"</pre></div>
  <h3>Once, on the machine that has your items</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park sync-seed --i-understand-this-runs-once</pre></div>
  <p>A second run, or a run on a second machine, duplicates every item. The command refuses if this machine's log already has entries.</p>
  <h3>On each other machine</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park rebuild --yes</pre></div>
  <p><code>rebuild</code> replaces the local database with what the logs contain. Run it only when the logs hold everything you want to keep.</p>
  <div class="note"><strong>Keep the database out of the synced folder</strong><p>SQLite stores one database in several files. A file syncer copies them one at a time, and a half-copied set fails with <code>database disk image is malformed</code>. A log file has one writer and only grows, which syncers handle safely.</p></div>
  <p>Item numbers such as <code>#12</code> are local to each machine. When two machines change the same item, the later change wins.</p>
</template>

<template id="t-review">
  <p class="eyebrow">Step 8 · About 2 minutes</p>
  <h2>Browse and review</h2>
  <p class="lead">Open your items in a browser, and check whether parked items come back into your work.</p>
  <h3>Web view</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park serve            <span class="c"># http://127.0.0.1:7654</span></pre></div>
  <p>The web view has search, a repository filter, and clickable tags and types. It is read-only and shows the items as they were when the server started.</p>
  <h3>Usage report</h3>
  <div class="term"><div class="term-head">Terminal<button class="copy">Copy</button></div><pre><span class="p">$ </span>park stats --days 7</pre></div>
  <div class="term out"><div class="term-head">Output</div><pre>Usage in the last 7 days

Events
  surfaced   search         2
  viewed     cli            2
  resolved   cli            1
  archived   cli            1

Surfaced items: 2
  later viewed:   1 (50%)
  later resolved: 1 (50%)
  later archived: 1 (50%)

How items came back
  source         surfaced  viewed  resolved  archived
  session-hook          0       0         0         0
  file-hook             0       0         0         0
  search                2       1         1         1
  list-tag              0       0         0         0
  direct                0       1         0         0</pre></div>
  <p>Each view, resolve or archive counts towards the way the item last reached you in the 2 hours before: the session hook, the file hook, a search or a tag list. <code>direct</code> means you went to the item without it being shown first. The record stays on this machine and does not sync.</p>
  <h3>You are set up</h3>
  <p>Next time you are interrupted, run <code>park add</code> before you switch. When you come back, run <code>park list --current</code>.</p>
  <p>Every command and flag is listed in the <a href="https://github.com/svandragt/park#readme">README</a>, and for commands that take flags, <code>park &lt;command&gt; -h</code> lists them.</p>
</template>

<script>
(function () {
  var steps = [
    { id: "install",  title: "Install" },
    { id: "park",     title: "Park an item" },
    { id: "find",     title: "Find it again" },
    { id: "finish",   title: "Close the loop" },
    { id: "organise", title: "Organise" },
    { id: "agent",    title: "Connect your agent" },
    { id: "sync",     title: "Sync machines", optional: true },
    { id: "review",   title: "Browse and review" }
  ];
  var KEY = "park-onboarding-done";
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  var rail = document.getElementById("rail");
  var main = document.getElementById("step");

  steps.forEach(function (s, i) {
    var li = document.createElement("li");
    li.innerHTML = '<a href="#' + s.id + '"><span class="num">' + (i + 1) + '</span><span>' + s.title +
      (s.optional ? '<span class="opt">optional</span>' : '') + '</span><span class="tick" role="img" aria-label="done">✓</span></a>';
    rail.appendChild(li);
  });

  function current() {
    var h = location.hash.slice(1);
    var i = steps.findIndex(function (s) { return s.id === h; });
    return i < 0 ? 0 : i;
  }

  function updateProgress() {
    var required = steps.filter(function (s) { return !s.optional; });
    var n = required.filter(function (s) { return done[s.id]; }).length;
    document.getElementById("progress-text").textContent = n + " of " + required.length;
    document.getElementById("progress-bar").style.width = (n / required.length * 100) + "%";
    rail.querySelectorAll("a").forEach(function (a, i) { a.classList.toggle("done", !!done[steps[i].id]); });
  }

  function render(focus) {
    var i = current(), s = steps[i];
    main.innerHTML = "";
    main.appendChild(document.getElementById("t-" + s.id).content.cloneNode(true));
    var foot = document.createElement("div");
    foot.className = "foot";
    foot.innerHTML =
      '<label class="check"><input type="checkbox" id="done-' + s.id + '"' + (done[s.id] ? " checked" : "") +
      '><span class="box" aria-hidden="true">✓</span>I have done this step</label>' +
      '<div class="nav-btns"><button class="btn" id="prev"' + (i === 0 ? " disabled" : "") + '>Back</button>' +
      '<button class="btn primary" id="next"' + (i === steps.length - 1 ? " disabled" : "") + '>Next step</button></div>';
    main.appendChild(foot);
    rail.querySelectorAll("a").forEach(function (a, j) {
      if (j === i) a.setAttribute("aria-current", "step"); else a.removeAttribute("aria-current");
    });
    document.getElementById("done-" + s.id).addEventListener("change", function (e) {
      done[s.id] = e.target.checked; save(); updateProgress();
    });
    document.getElementById("prev").addEventListener("click", function () { location.hash = steps[i - 1].id; });
    document.getElementById("next").addEventListener("click", function () {
      if (!done[s.id]) { done[s.id] = true; save(); updateProgress(); }
      location.hash = steps[i + 1].id;
    });
    main.querySelectorAll(".copy").forEach(function (b) {
      b.addEventListener("click", function () {
        var pre = b.closest(".term").querySelector("pre");
        var text = Array.prototype.map.call(pre.childNodes, function (n) {
          return n.nodeType === 1 && (n.classList.contains("p") || n.classList.contains("c")) ? "" : n.textContent;
        }).join("").split("\n").map(function (l) { return l.replace(/\s+$/, ""); }).join("\n");
        function ok() { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy"; }, 1500); }
        function fallback() {
          var r = document.createRange(); r.selectNodeContents(pre);
          var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
          b.textContent = "Selected";
        }
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
    });
    if (focus) { main.focus({ preventScroll: true }); main.scrollIntoView({ block: "start", behavior: "smooth" }); }
    updateProgress();
  }

  window.addEventListener("hashchange", function () { render(true); });
  render(false);
})();
</script>
</body>
</html>
